<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3B8A55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="주민 등록부">
<meta name="author" content="달연어 (Dal Yeon-eo)">
<meta name="description" content="모여봐요 동물의 숲 섬 주민의 입주부터 이사까지 기록하는 개인 기록장">
<meta property="og:title" content="우리 섬 주민 등록부">
<meta property="og:description" content="모여봐요 동물의 숲 섬 주민의 입주부터 이사까지 기록하는 개인 기록장">
<meta property="og:image" content="https://dalyeoneo-cmd.github.io/animal_registration/preview.png">
<meta property="og:url" content="https://dalyeoneo-cmd.github.io/animal_registration/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>우리 섬 주민 등록부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: a resident registry ledger — island header, tab strip, ID-card style resident cards, bottom sheets for forms; timeline view as a scrollable stay chart */
:root{
  --bg:#EDF2E4; --paper:#FFFDF6; --ink:#2C3829; --muted:#68745F; --line:#D5DDC6;
  --leaf:#3B8A55; --leaf-soft:#DCEBD8; --sky:#3F8FBF; --sun:#D9A225; --gone:#AE7454; --gone-soft:#F2E3D8; --danger:#B4473B;
  --av-l:86%; --av-t:26%;
  --display:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141C16; --paper:#1D2820; --ink:#E7EEDF; --muted:#9AA892; --line:#314031;
  --leaf:#6BC488; --leaf-soft:#22362A; --sky:#7CBCE2; --sun:#EEC45A; --gone:#D69A7A; --gone-soft:#3A2A22; --danger:#E5786B;
  --av-l:28%; --av-t:86%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141C16; --paper:#1D2820; --ink:#E7EEDF; --muted:#9AA892; --line:#314031;
  --leaf:#6BC488; --leaf-soft:#22362A; --sky:#7CBCE2; --sun:#EEC45A; --gone:#D69A7A; --gone-soft:#3A2A22; --danger:#E5786B;
  --av-l:28%; --av-t:86%; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,.disp{font-family:var(--display);font-weight:700;letter-spacing:-.015em;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-direction:column;gap:14px;margin-bottom:18px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.island{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.island h1{font-size:clamp(21px,5.2vw,27px);line-height:1.3}
.island h1 span{color:var(--leaf)}
.island-edit{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:2px}
.island-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:9px 4px 7px;text-align:center;min-width:0}
.stat+.stat{border-left:1px solid var(--line)}
.stat .sl{font-size:11.5px;color:var(--muted);line-height:1.3;word-break:keep-all}
.stat b{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.15;color:var(--ink)}
.stat b small{font-size:14px;color:var(--muted);font-weight:400;margin-left:1px}
.stat.main b{color:var(--leaf)}
.stat.full b{color:var(--sun)}
@media (max-width:420px){.stat .sl{font-size:10.5px}.stat b{font-size:18px}}
.bday{font-size:14px;color:var(--muted)}
.bday strong{color:var(--ink);font-weight:400}

.banner{background:var(--paper);border:1px dashed var(--line);border-radius:var(--r);padding:10px 14px;font-size:13.5px;color:var(--muted);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.banner button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:13px}

/* tabs */
.tab .c{font-size:13px;opacity:.85;margin-left:4px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.card{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--leaf)}
.card.gone{background:var(--paper)}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:22px;background:hsl(var(--h) 50% var(--av-l));color:hsl(var(--h) 40% var(--av-t))}
.card.gone .avatar{filter:saturate(.35)}
.cbody{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.cname{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cname h3{font-size:16.5px;line-height:1.2;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted)}
.days{font-family:var(--display);font-weight:600;font-size:13.5px;color:var(--leaf)}
.card.gone .days{color:var(--gone)}
.chip{font-size:11.5px;line-height:1.5;border-radius:4px;padding:1px 6px;border:1px solid transparent;background:var(--bg);color:var(--muted);white-space:nowrap;font-weight:600}
.chip.ex{border:1px dashed var(--line);background:none}
.chip.fav{background:color-mix(in srgb,var(--sun) 22%,var(--paper));color:color-mix(in srgb,var(--sun) 45%,var(--ink))}
.chip.pic{background:color-mix(in srgb,var(--sky) 16%,var(--paper));color:color-mix(in srgb,var(--sky) 55%,var(--ink))}
.chip.stay-mark{background:var(--leaf);color:var(--paper)}
.chip.nopic{background:var(--gone-soft);color:var(--gone)}
.miss{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--gone-soft);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13.5px}
.miss b{color:var(--gone);font-weight:600}
.miss button{border:1px solid var(--gone);background:none;color:var(--gone);border-radius:6px;padding:4px 10px;font-size:12.5px;font-weight:600}
.miss button[aria-pressed="true"]{background:var(--gone);color:var(--paper)}
.quick{border:1px dashed var(--sky);background:none;color:var(--sky);border-radius:999px;padding:1px 10px;font-size:12.5px;margin-left:4px}
.checkrow{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center}
.checkrow label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)}
.checkrow input[type=checkbox]{width:auto}
.checkrow input[type=date]{width:auto;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 9px}

.empty{background:var(--paper);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty .disp{font-size:16.5px;color:var(--ink)}

/* timeline */
.tl{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.tl-inner{position:relative;min-width:100%}
.tl-head{position:relative;height:28px;border-bottom:1px solid var(--line);margin-left:92px}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:11px;color:var(--muted);padding:6px 0 0 4px;white-space:nowrap}
.tl-row{display:flex;align-items:center;height:36px;border-bottom:1px solid var(--line)}
.tl-row:last-child{border-bottom:0}
.tl-name{position:sticky;left:0;z-index:1;flex:none;width:92px;padding:0 10px;background:var(--paper);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line);height:100%;display:flex;align-items:center}
.tl-track{position:relative;flex:none;height:100%}
.bar{position:absolute;top:9px;height:18px;border-radius:9px;background:var(--leaf);min-width:6px;border:0;padding:0}
.bar.gone{background:var(--gone)}
.bar.now::after{content:"";position:absolute;right:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--sun);border:2px solid var(--paper)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin:10px 2px 0;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:8px;border-radius:4px;margin-right:5px;vertical-align:middle}

/* fab */
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));border:0;border-radius:999px;background:var(--leaf);color:var(--paper);font-family:var(--display);font-weight:600;font-size:14.5px;padding:11px 18px;box-shadow:0 6px 18px rgb(0 0 0 / .18);z-index:5}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(10 20 10 / .42);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overscroll-behavior:contain;overflow-y:auto;border-radius:20px 20px 0 0;padding-block:20px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:20px;padding-bottom:22px}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-20px;margin-top:-20px;padding-block:20px 10px;background:var(--paper);z-index:4;margin-inline:-20px;padding-inline:20px}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-8px auto 0;flex:none}
@media (min-width:600px){.sheet::before{display:none}}
.sheet-head h2{font-size:19px}
.x{border:0;background:var(--bg);border-radius:50%;width:34px;height:34px;font-size:18px;line-height:1;flex:none}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f label{font-size:12.5px;color:var(--muted);letter-spacing:.02em}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;min-width:0}
.f textarea{resize:vertical;min-height:70px}
.row2{display:flex;gap:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 16px;min-height:42px}
.btn.pri{background:var(--leaf);border-color:var(--leaf);color:var(--paper);font-family:var(--display);font-weight:600;font-size:14px}
.btn.warm{background:var(--gone);border-color:var(--gone);color:var(--paper);font-family:var(--display);font-weight:600;font-size:14px}
.btn.danger{color:var(--danger);border-color:var(--danger);background:none}
.btn.ghost{background:none}
.err{color:var(--danger);font-size:13px;min-height:0}

/* detail */
.id-top{display:flex;gap:14px;align-items:center}
.id-top .avatar{width:56px;height:56px;font-size:28px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14.5px;background:var(--bg);border-radius:var(--r);padding:12px 14px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.stay{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.stay .big{font-family:var(--display);font-weight:600;font-size:23px;color:var(--leaf)}
.stay.gone .big{color:var(--gone)}
.note{background:var(--bg);border-radius:var(--r);padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{font-size:15px}
.diary{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.diary li{position:relative;padding:4px 0 10px 16px}
.diary li::before{content:"";position:absolute;left:-6px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--leaf)}
.diary li.in::before{background:var(--leaf)}
.diary li.out::before{background:var(--gone);border-color:var(--gone)}
.diary .d{font-size:12.5px;color:var(--muted)}
.diary .t{white-space:pre-wrap;overflow-wrap:anywhere}
.diary .rm{border:0;background:none;color:var(--muted);font-size:12px;padding:0 4px;text-decoration:underline}
.add-diary{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.add-diary input[type=date]{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
.add-diary input[type=text]{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
.panel{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.panel.warm{border-color:var(--gone);background:var(--gone-soft)}
.loading{color:var(--muted);text-align:center;padding:30px 0}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.toolbar .vt{font-weight:600;color:var(--ink);font-size:15px}
.toolbar .sr{display:flex;align-items:center;gap:6px}
.toolbar select{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 10px;font-size:13px}
.grp{font-size:15px;margin:16px 2px 8px;display:flex;gap:6px;align-items:baseline}
.grp:first-of-type{margin-top:0}
.grp span{font-family:var(--body);font-size:12.5px;color:var(--muted);font-weight:400}
/* photos */
.avatar{position:relative;overflow:hidden}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.avatar.ic{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-weight:400}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.ph{aspect-ratio:1;max-width:100%;border:0;padding:0;border-radius:10px;overflow:hidden;background:var(--bg);position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cov{position:absolute;left:5px;top:5px;font-size:10.5px;background:var(--leaf);color:var(--paper);border-radius:999px;padding:0 6px}
.ph-add{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:10px;display:grid;place-items:center;text-align:center;font-size:13px;color:var(--muted);cursor:pointer;padding:6px}
.ph-add:hover{border-color:var(--leaf);color:var(--leaf)}
.ph-add{position:relative;overflow:hidden}
.ph-add input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.big-photo{width:100%;max-height:60vh;object-fit:contain;border-radius:var(--r);background:var(--bg)}
.hint{font-size:13px;color:var(--muted)}
/* route */
.chip.route{border-color:transparent;background:hsl(var(--rh) 45% var(--chip-l));color:hsl(var(--rh) 40% var(--chip-t))}
:root{--chip-l:90%;--chip-t:28%}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--chip-l:24%;--chip-t:84%}}
:root[data-theme="dark"]{--chip-l:24%;--chip-t:84%}
.routes{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
.routes h3{font-size:15px}
.rbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--bg)}
.rbar span{height:100%;background:hsl(var(--rh) 50% 55%)}
.rleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.rleg i{display:inline-block;width:10px;height:10px;border-radius:50%;background:hsl(var(--rh) 50% 55%);margin-right:5px;vertical-align:-1px}
/* name suggest */
.suggest{position:relative}
.sug-list{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:3;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 20px rgb(0 0 0 / .14);max-height:240px;overflow-y:auto;list-style:none;padding:4px;margin-block:4px 0}
.sug-list button{width:100%;text-align:left;border:0;background:none;padding:7px 9px;border-radius:7px;display:flex;justify-content:space-between;gap:8px}
.sug-list button:hover,.sug-list button.on{background:var(--leaf-soft)}
.sug-list small{color:var(--muted)}
/* dex */
.dex-top{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.dex-count{font-size:14px;color:var(--muted)}
.dex-count b{font-family:var(--display);font-weight:600;font-size:18px;color:var(--leaf)}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter span{display:block;height:100%;background:var(--leaf)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}
.filters input,.filters select{width:100%;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px}
@media (max-width:560px){.filters{grid-template-columns:1fr 1fr}.filters .q{grid-column:1/-1}}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dx{display:flex;gap:9px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 10px;min-width:0}
.dx:hover{border-color:var(--leaf)}
.dx .avatar{width:34px;height:34px;font-size:16px}
.dx span.t{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.dx b{font-weight:400;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dx small{font-size:11.5px;color:var(--muted)}
.dx.met{border-color:var(--leaf);background:var(--leaf-soft)}
.dx.left{border-color:var(--gone);background:var(--gone-soft)}
.dx:not(.met):not(.left) .avatar{opacity:.55}
@media (max-width:420px){.fields{grid-template-columns:1fr}}
.foot{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.foot h3{font-size:15px}
.foot p{margin:0}
.foot-btns{display:flex;gap:8px;flex-wrap:wrap}
.foot-btns .btn{display:inline-flex;align-items:center;cursor:pointer}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.intro{background:var(--paper);border:1px solid var(--leaf);border-radius:12px;padding:16px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
.intro h2{font-size:17px;color:var(--leaf)}
.intro ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:13.5px;line-height:1.55}
.intro b{font-weight:600}
.intro .btn{align-self:flex-start}
.credit{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:12px;color:var(--muted);line-height:1.6}
.credit p{margin:0}
.credit .maker{color:var(--ink);font-weight:500}
.credit .maker b{color:var(--leaf);font-weight:600}
.credit a{color:var(--muted)}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:center;align-items:stretch;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.bnav .tab{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:500;padding:8px 0 7px;min-height:58px}
.bnav .tab svg{width:23px;height:23px}
.bnav .tab[aria-selected="true"]{color:var(--leaf);font-weight:700}
.bnav .tab[aria-selected="true"] svg{stroke-width:2.3}
.addbtn{flex:0 0 auto;align-self:center;width:50px;height:50px;margin:0 8px;border:0;border-radius:16px;background:var(--leaf);color:var(--paper);display:grid;place-items:center;box-shadow:0 4px 12px rgb(0 0 0 / .16)}
.addbtn svg{width:26px;height:26px;stroke-width:2.4}
/* touch & mobile sizing */
@media (max-width:600px){
  .f input,.f select,.f textarea,.filters input,.filters select,.add-diary input,.toolbar select{font-size:16px}
  .top{gap:10px;margin-bottom:14px}
  .eyebrow{display:none}
  .card{padding:12px}
  .sheet{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .sheet-head{margin-inline:-16px;padding-inline:16px}
  .actions .btn{flex:1 1 auto}
  .dex{grid-template-columns:repeat(2,minmax(0,1fr))}
}

.brand,.side-note,.addlbl{display:none}
/* ---------- desktop ---------- */
@media (min-width:960px){
  .bnav{top:0;bottom:0;right:auto;width:236px;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:4px;border-top:0;border-right:1px solid var(--line);padding:22px 14px calc(18px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
  .brand{display:flex;align-items:center;gap:10px;padding:0 6px 18px;font-weight:700;font-size:16px;color:var(--ink)}
  .brand img{width:40px;height:40px;border-radius:10px}
  .addbtn{order:-1;align-self:stretch;width:auto;height:46px;margin:0 0 14px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14.5px;font-weight:600;box-shadow:none}
  .addbtn svg{width:20px;height:20px}
  .addlbl{display:inline}
  .brand{order:-2}
  .bnav .tab{flex:0 0 auto;max-width:none;flex-direction:row;justify-content:flex-start;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;font-size:14.5px}
  .bnav .tab svg{width:21px;height:21px}
  .bnav .tab:hover{background:var(--bg);color:var(--ink)}
  .bnav .tab[aria-selected="true"]{background:var(--leaf-soft);color:var(--leaf)}
  .side-note{display:block;margin-top:auto;padding:0 8px;font-size:12px;line-height:1.55;color:var(--muted)}
  .wrap{max-width:1120px;margin:0 0 0 236px;padding-block:34px 60px;padding-left:44px;padding-right:44px}
  @media (min-width:1400px){.wrap{margin-left:calc(236px + (100vw - 236px - 1120px)/2)}}
  .top{flex-direction:row;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 28px;margin-bottom:26px}
  .top .eyebrow{flex-basis:100%;margin-bottom:-8px}
  .island h1{font-size:30px}
  .stats{flex:0 1 560px}
  .stat{padding:11px 6px 9px}
  .bday{flex-basis:100%}
  .grid{grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
  .card{padding:16px}
  .card:hover{box-shadow:0 6px 18px rgb(0 0 0 / .06)}
  .dex{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .toolbar{margin-bottom:14px}
  .toolbar .vt{font-size:17px}
  .scrim{padding:24px}
  .sheet{max-width:640px;max-height:88vh;border-radius:18px;padding:26px 30px 28px}
  .sheet-head{top:-26px;margin-top:-26px;padding-block:26px 12px;margin-inline:-30px;padding-inline:30px}

}
.f.checkrow{flex-direction:row;align-items:center}
.f.actions{flex-direction:row;justify-content:flex-end;flex-wrap:wrap}

.intro-btns{display:flex;gap:8px;flex-wrap:wrap}
.guide{display:flex;flex-direction:column;gap:16px}
.ghead{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ghead h2{font-size:20px}
.ghead p{margin:0;color:var(--muted);font-size:14px}
.ghead .btn{margin-top:6px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:10px;align-items:start}
.gsec{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.gsec h3{font-size:15.5px;color:var(--leaf);margin-bottom:8px}
.gsec ul,.gsec ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:14px;line-height:1.6}
.gsec b{font-weight:600}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:14px;align-items:center}
.keys dd{margin:0}
kbd{display:inline-block;min-width:22px;text-align:center;font:600 12px/1 var(--body);padding:4px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--bg);color:var(--ink)}
.paste{width:100%;border:1px dashed var(--line);background:none;border-radius:10px;padding:9px 11px;font-size:16px;resize:none;height:44px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const toUTC=s=>{const[y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)};
const daysBetween=(a,b)=>Math.round((toUTC(b)-toUTC(a))/864e5);
function fmtDate(s,p){if(!s)return "날짜 모름";const[y,m,d]=s.split("-").map(Number);return p==="month"?`${y}년 ${m}월쯤`:`${y}년 ${m}월 ${d}일`}
function fmtShort(s,p){if(!s)return "?";const[y,m,d]=s.split("-").map(Number);return p==="month"?`${String(y).slice(2)}.${String(m).padStart(2,"0")}쯤`:`${String(y).slice(2)}.${String(m).padStart(2,"0")}.${String(d).padStart(2,"0")}`}
function fmtBday(b){if(!b)return "";const[m,d]=b.split("-").map(Number);return `${m}월 ${d}일`}
const isNow=v=>!v.moveOut&&!v.left;
function stayDays(v){if(!v.moveIn)return null;if(!isNow(v)&&!v.moveOut)return null;return daysBetween(v.moveIn,v.moveOut||todayStr())}
const approx=v=>v.inPrec==="month"||(!isNow(v)&&v.outPrec==="month");
function stayText(n,ap){if(n==null)return "기간 모름";if(n<0)return "입주 예정";if(n<1)return "오늘 입주";const y=Math.floor(n/365),rest=n%365;return (ap?"약 ":"")+(y?`${y}년 ${rest}일`:`${n}일`)}
function nowText(v,n){return n==null?"입주일 모름":n>=1?`입주 ${approx(v)?"약 ":""}${n}일째`:stayText(n)}
const inKey=v=>v.moveIn||"0000",outKey=v=>v.moveOut||v.moveIn||"0000";
function datePick(id,label,val,prec){prec=prec||"day";const mv=val?val.slice(0,7):"";
  return `<div class="f"><label for="${id}P">${label}</label><select id="${id}P"><option value="day" ${prec==="day"?"selected":""}>날짜를 알아요</option><option value="month" ${prec==="month"?"selected":""}>몇 월쯤인지만 알아요</option><option value="unknown" ${prec==="unknown"?"selected":""}>기억 안 나요</option></select>
  <input type="date" id="${id}D" value="${prec==="day"?esc(val||""):""}" aria-label="${label} 날짜"><input type="month" id="${id}M" value="${prec==="month"?esc(mv):""}" placeholder="2026-03" aria-label="${label} 년월"></div>`}
function wireDate(id){const p=$("#"+id+"P");const f=()=>{$("#"+id+"D").hidden=p.value!=="day";$("#"+id+"M").hidden=p.value!=="month"};p.onchange=f;f()}
function readDate(id){const p=$("#"+id+"P").value;if(p==="unknown")return{date:"",prec:"unknown"};
  if(p==="month"){const m=$("#"+id+"M").value.trim();return /^\d{4}-\d{2}$/.test(m)?{date:m+"-01",prec:"month"}:{err:true}}
  const d=$("#"+id+"D").value;return d?{date:d,prec:"day"}:{err:true}}
function newId(){return "v"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

/* ---------- storage: IndexedDB in this browser ---------- */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open("acnh-registry",1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("kv"))d.createObjectStore("kv");if(!d.objectStoreNames.contains("photos"))d.createObjectStore("photos")};r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  run(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode),q=fn(t.objectStore(store));t.oncomplete=()=>res(q?q.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  get(store,k){return this.run(store,"readonly",s=>s.get(k))},
  put(store,k,v){return this.run(store,"readwrite",s=>s.put(v,k))},
  del(store,k){return this.run(store,"readwrite",s=>s.delete(k))},
  clear(store){return this.run(store,"readwrite",s=>s.clear())},
  all(store){return new Promise((res,rej)=>{const t=this.db.transaction(store),st=t.objectStore(store),ks=st.getAllKeys(),vs=st.getAll();t.oncomplete=()=>res(ks.result.map((k,i)=>[k,vs.result[i]]));t.onerror=()=>rej(t.error)})}};
async function persist(){if(!S.idbOk)return;await IDB.put("kv","data",{villagers:S.villagers,island:S.island})}

async function putVillager(v){
  const i=S.villagers.findIndex(x=>x.id===v.id);if(i>=0)S.villagers[i]=v;else S.villagers.push(v);
  await persist();render();
}
async function delVillager(id){
  const v=S.villagers.find(x=>x.id===id);
  S.villagers=S.villagers.filter(x=>x.id!==id);await persist();
  for(const p of (v&&v.photos)||[])await dropPhoto(p.id);
  render();
}
async function putIsland(name){S.island={name};await persist();render()}
function writeFailed(e){
  if(e&&e.name==="QuotaExceededError")return "휴대폰 저장 공간이 부족해요. 사진을 몇 장 지운 뒤 다시 저장해 주세요.";
  return "저장하지 못했어요. 잠시 뒤 다시 눌러 주세요.";
}

async function applyBackup(){

const SORTS={now:[["","입주일순"],["name","이름순"],["stay","거주 기간 긴 순"],["forever","지박령 먼저"],["fav","최애 먼저"],["species","종족별"],["personality","성격별"]],
  gone:[["","최근 이사순"],["name","이름순"],["stay","함께한 기간 긴 순"],["fav","최애 먼저"],["species","종족별"],["personality","성격별"]]};
function listHTML(list,tab){
  const k=SORTS[tab].some(o=>o[0]===S.sort[tab])?S.sort[tab]:"";
  const byName=(a,b)=>a.name.localeCompare(b.name,"ko");
  const base=list.slice(),pos=new Map(base.map((v,i)=>[v.id,i])),keep=(a,b)=>pos.get(a.id)-pos.get(b.id);
  let arr=base,groups=null;
  if(k==="name")arr=base.sort(byName);
  else if(k==="stay")arr=base.sort((a,b)=>{const x=stayDays(a),y=stayDays(b);return (y??-1)-(x??-1)||keep(a,b)});
  else if(k==="forever")arr=base.sort((a,b)=>(b.forever?1:0)-(a.forever?1:0)||keep(a,b));
  else if(k==="fav")arr=base.sort((a,b)=>(b.favorite?1:0)-(a.favorite?1:0)||keep(a,b));
  else if(k==="species"||k==="personality"){
    const order=k==="personality"?PERS:[...new Set(base.map(v=>v.species).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ko"));
    const m=new Map();base.forEach(v=>{const g=v[k]||"";if(!m.has(g))m.set(g,[]);m.get(g).push(v)});
    groups=[...order.filter(g=>m.has(g)),...[...m.keys()].filter(g=>g&&!order.includes(g)),...(m.has("")?[""]:[])].map(g=>[g||(k==="species"?"종족 미입력":"성격 미입력"),m.get(g).sort(byName)]);
  }
  const bar=`<div class="toolbar"><span class="vt">${tab==="now"?"지금 사는 주민":"떠난 주민"} <span class="num">${list.length}</span>명</span><span class="sr"><label for="sortSel">정렬</label><select id="sortSel">${SORTS[tab].map(([v,l])=>`<option value="${v}" ${v===k?"selected":""}>${l}</option>`).join("")}</select></span></div>`;
  if(groups)return bar+groups.map(([g,vs])=>`<h3 class="grp">${esc(g)} <span class="num">${vs.length}</span></h3><div class="grid">${vs.map(card).join("")}</div>`).join("");
  return bar+`<div class="grid">${arr.map(card).join("")}</div>`;
}
function routesHTML(){

/* ---------- dex ---------- */
function statusOf(name){const rs=S.villagers.filter(v=>v.name===name);if(!rs.length)return null;const cur=rs.find(isNow);return cur?{st:"now",v:cur}:{st:"left",v:rs.sort((a,b)=>outKey(b).localeCompare(outKey(a)))[0]}}
function renderDex(){
  const d=S.dex,view=$("#view");
  const sps=[...new Set(DEX.map(r=>r[1]))].sort((a,b)=>a.localeCompare(b,"ko"));
  view.innerHTML=`<div class="dex-top"><div class="dex-count" id="dexCount"></div><div class="meter"><span id="dexMeter"></span></div>
  <div class="filters"><input class="q" id="dq" type="search" placeholder="이름이나 말버릇으로 찾기" value="${esc(d.q)}" aria-label="주민 찾기">
  <select id="dsp" aria-label="종족">${opts(sps,d.sp,"모든 종족")}</select>
  <select id="dpe" aria-label="성격">${opts(PERS,d.pe,"모든 성격")}</select>
  <select id="dst" aria-label="만남 여부"><option value="">전체</option><option value="met" ${d.st==="met"?"selected":""}>만난 주민</option><option value="now" ${d.st==="now"?"selected":""}>지금 사는 주민</option><option value="no" ${d.st==="no"?"selected":""}>아직 못 만난 주민</option><option value="forever" ${d.st==="forever"?"selected":""}>지박령 확정 주민</option><option value="pic" ${d.st==="pic"?"selected":""}>사진 받은 주민</option><option value="nopic" ${d.st==="nopic"?"selected":""}>만났지만 사진은 아직</option><option value="leftnopic" ${d.st==="leftnopic"?"selected":""}>떠났는데 사진 못 받음</option></select></div></div>
  <div class="dex" id="dexList"></div>`;
  const upd=()=>{d.q=$("#dq").value.trim();d.sp=$("#dsp").value;d.pe=$("#dpe").value;d.st=$("#dst").value;renderDexList()};
  $("#dq").addEventListener("input",upd);["#dsp","#dpe","#dst"].forEach(s=>$(s).addEventListener("change",upd));
  renderDexList();
}
function renderDexList(){
  const d=S.dex,met=new Set(S.villagers.map(v=>v.name).filter(n=>DEXMAP.has(n)));
  $("#dexCount").innerHTML=`전체 <span class="num">${DEX.length}</span>명 중 <b class="num">${met.size}</b>명을 만났어요`;
  $("#dexMeter").style.width=(met.size/DEX.length*100)+"%";
  const rows=DEX.filter(r=>{if(d.q&&!(r[0].includes(d.q)||r[5].includes(d.q)))return false;if(d.sp&&r[1]!==d.sp)return false;if(d.pe&&r[2]!==d.pe)return false;
    if(d.st){const s=statusOf(r[0]);if(d.st==="met"&&!s)return false;if(d.st==="now"&&(!s||s.st!=="now"))return false;if(d.st==="no"&&s)return false;
    const pic=S.villagers.some(v=>v.name===r[0]&&v.gotPhoto);if(d.st==="pic"&&!pic)return false;if(d.st==="forever"&&!(s&&s.st==="now"&&s.v.forever))return false;if(d.st==="nopic"&&(!s||pic))return false;if(d.st==="leftnopic"&&(!s||s.st!=="left"||pic))return false}return true});
  const el=$("#dexList");
  el.innerHTML=rows.length?rows.map(r=>{const s=statusOf(r[0]);const v=s?s.v:{name:r[0],personality:r[2]};
    return `<button class="dx ${s?(s.st==="now"?"met":"left"):""}" data-dex="${esc(r[0])}">${avatar(v)}<span class="t"><b>${esc(r[0])}</b><small>${esc(r[1])} · ${esc(r[2])}${s?(s.st==="now"?" · 사는 중":" · 떠남"):""}${S.villagers.some(v=>v.name===r[0]&&v.gotPhoto)?" · 사진":""}</small></span></button>`}).join("")
    :`<div class="empty" style="grid-column:1/-1">조건에 맞는 주민이 없어요.</div>`;
  el.querySelectorAll("[data-dex]").forEach(b=>b.onclick=()=>{const s=statusOf(b.dataset.dex);if(s)openDetail(s.v.id);else if(S.canWrite)openForm(null,b.dataset.dex)});
}
function emptyHTML(t,s){return `<div class="empty"><div class="disp">${t}</div><div>${s}</div>${S.canWrite?`<button class="btn pri" data-add>+ 새 주민 입주</button>`:""}</div>`}
function card(v){
  const n=stayDays(v),gone=!isNow(v);
  return `<button class="card ${gone?"gone":""}" data-open="${esc(v.id)}">${avatar(v)}<span class="cbody">
    <span class="cname"><h3>${esc(v.name)}</h3>${v.forever&&isNow(v)?`<span class="chip stay-mark">지박령</span>`:""}${v.favorite?`<span class="chip fav">최애</span>`:""}${v.gotPhoto?`<span class="chip pic">사진 받음</span>`:(!isNow(v)?`<span class="chip nopic">사진 못 받음</span>`:"")}${v.example?`<span class="chip ex">예시</span>`:""}</span>
    <span class="meta">${[v.species,v.personality].filter(Boolean).map(esc).join(" · ")||"&nbsp;"}</span>
    <span class="days num">${gone?(n==null?"함께한 기간 모름":`함께한 ${stayText(n,approx(v))}`):nowText(v,n)}</span>
    <span class="meta num" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${gone?`${fmtShort(v.moveIn,v.inPrec)} – ${fmtShort(v.moveOut,v.outPrec)}`:(v.moveIn?`${fmtShort(v.moveIn,v.inPrec)} 입주`:"입주일 모름")}${routeChip(v)}</span>
  </span></button>`;
}
function timelineHTML(){
  const list=S.villagers.filter(v=>v.moveIn&&(isNow(v)||v.moveOut)).sort((a,b)=>a.moveIn.localeCompare(b.moveIn));
  const skip=S.villagers.length-list.length;
  if(!list.length&&skip)return `<div class="empty">날짜를 기록한 주민이 아직 없어요. 입주일이나 이사 간 날을 대략이라도 적으면 타임라인에 나타나요.</div>`;
  if(!list.length)return emptyHTML("타임라인이 비어 있어요","주민을 등록하면 누가 언제부터 언제까지 섬에 살았는지 막대로 한눈에 보여 드려요.");
  const end=todayStr();
  let start=list[0].moveIn;
  const [sy,sm]=start.split("-").map(Number);start=`${sy}-${String(sm).padStart(2,"0")}-01`;
  const total=Math.max(30,daysBetween(start,end)+10);
  const avail=Math.max(200,(document.querySelector("#view").clientWidth||330)-2-92-6);
  const ppd=Math.max(avail/total,0.45);
  const W=Math.ceil(total*ppd);
  // month ticks
  let ticks="",[y,m]=[sy,sm],step=Math.max(1,Math.ceil(62/(30.4*ppd))),i=0,lastY=null;
  while(true){const s=`${y}-${String(m).padStart(2,"0")}-01`;const off=daysBetween(start,s);if(off>total)break;
    if(i%step===0&&off*ppd<W-44)ticks+=`<span class="tick num" style="left:${off*ppd}px">${y!==lastY?`${String(y).slice(2)}년 `:""}${m}월</span>`,lastY=y;
    i++;m++;if(m>12){m=1;y++}}
  const rows=list.map(v=>{const a=daysBetween(start,v.moveIn),b=daysBetween(start,v.moveOut||end);
    return `<div class="tl-row"><div class="tl-name" title="${esc(v.name)}">${esc(v.name)}</div><div class="tl-track" style="width:${W}px"><button class="bar ${isNow(v)?"now":"gone"}" data-open="${esc(v.id)}" style="left:${a*ppd}px;width:${Math.max(6,(b-a)*ppd)}px" aria-label="${esc(v.name)} ${fmtDate(v.moveIn,v.inPrec)}부터 ${v.moveOut?fmtDate(v.moveOut,v.outPrec)+"까지":"지금까지"}"></button></div></div>`}).join("");
  return `<div class="tl"><div class="tl-inner" style="width:${W+92}px"><div class="tl-head" style="width:${W}px">${ticks}</div>${rows}</div></div>
  <div class="legend"><span><i style="background:var(--leaf)"></i>지금 사는 주민</span><span><i style="background:var(--gone)"></i>떠난 주민</span><span>막대를 누르면 기록을 볼 수 있어요</span>${skip?`<span>날짜를 모르는 주민 ${skip}명은 빠져 있어요</span>`:""}</div>`;
}

function refreshSheet(){if(sheetState&&sheetState.type==="detail"){const v=S.villagers.find(x=>x.id===sheetState.id);if(!v)closeSheet();}}

function opts(list,sel,blank){return (blank?`<option value="">${blank}</option>`:"")+list.map(o=>`<option ${o===sel?"selected":""}>${esc(o)}</option>`).join("")}
function openForm(id,prefillName){

    <div class="f"><label for="fSpecies">종족</label><input id="fSpecies" list="speciesList" maxlength="10" value="${esc(f?.species||"")}" placeholder="예: 고양이"><datalist id="speciesList">${SPECIES.map(s=>`<option value="${s}">`).join("")}</datalist></div>

    <div class="f"><label for="fBm">생일</label><div class="row2"><select id="fBm" aria-label="생일 월">${opts(months,bm,"월")}</select><select id="fBd" aria-label="생일 일">${opts(days,bd,"일")}</select></div></div>

    ${v&&!isNow(v)?`${datePick("fOut","이사 간 날",v.moveOut,v.outPrec||(v.moveOut?"day":"unknown"))}
    <div class="f"><label for="fWhy">이사 이유</label><select id="fWhy">${opts(LEAVE,v.leaveReason,"선택 안 함")}</select></div>
    <div class="f wide"><label for="fBye">마지막 인사</label><textarea id="fBye" maxlength="500">${esc(v.farewell||"")}</textarea></div>`:""}
    <div class="f wide"><label for="fNote">메모</label><textarea id="fNote" maxlength="1000" placeholder="자유롭게 적어 주세요">${esc(v?.note||"")}</textarea></div>
    <div class="f wide checkrow"><label><input type="checkbox" id="fFav" ${v?.favorite?"checked":""}> 최애 주민으로 표시</label>
      <label><input type="checkbox" id="fForever" ${v?.forever?"checked":""}> 섬 지박령 확정</label>
      <label><input type="checkbox" id="fPic" ${v?.gotPhoto?"checked":""}> 주민 사진을 받았어요</label></div>
    <div class="err f wide" id="fErr" role="alert"></div>

  $("#vf").onsubmit=async e=>{

    if(!name){$("#fErr").textContent="주민 이름을 적어 주세요.";return}
    if(di.err){$("#fErr").textContent="입주일을 고르거나 ‘기억 안 나요’를 선택해 주세요.";return}
    const bmv=$("#fBm").value,bdv=$("#fBd").value;
    const rec={...(v||{}),id:v?.id||newId(),name,species:$("#fSpecies").value.trim(),personality:$("#fPers").value,birthday:bmv&&bdv?`${bmv.padStart(2,"0")}-${bdv.padStart(2,"0")}`:"",moveIn,inPrec:di.prec,arrival:$("#fHow").value,note:$("#fNote").value.trim(),favorite:$("#fFav").checked,forever:$("#fForever").checked,gotPhoto:$("#fPic").checked,entries:v?.entries||[],photos:v?.photos||[],moveOut:v?.moveOut||null,createdAt:v?.createdAt||new Date().toISOString()};
    if(v&&!isNow(v)){const dout=readDate("fOut");if(dout.err){$("#fErr").textContent="이사 간 날을 고르거나 ‘기억 안 나요’를 선택해 주세요.";return}
      if(dout.date&&moveIn&&dout.date.slice(0,dout.prec==="month"?7:10)<moveIn.slice(0,dout.prec==="month"?7:10)){$("#fErr").textContent="이사 간 날이 입주일보다 빨라요.";return}
      rec.moveOut=dout.date;rec.outPrec=dout.prec;rec.left=true;rec.leaveReason=$("#fWhy").value;rec.farewell=$("#fBye").value.trim()}
    delete rec.example;
    try{await putVillager(rec);if(!v){S.tab="now";render()}openDetail(rec.id)}catch(err){$("#fErr").textContent=writeFailed(err)}
  };
}

function wireNameSuggest(){
  const inp=$("#fName"),ul=$("#sugList");let items=[],on=-1;
  const close=()=>{ul.hidden=true;inp.setAttribute("aria-expanded","false");on=-1};
  const pick=r=>{inp.value=r.name;$("#fSpecies").value=r.species;$("#fPers").value=r.personality;
    const[m,d]=r.birthday.split("-");$("#fBm").value=String(Number(m));$("#fBd").value=String(Number(d));close()};
  const draw=()=>{ul.innerHTML=items.map((r,i)=>`<li><button type="button" role="option" class="${i===on?"on":""}" data-i="${i}"><span>${esc(r.name)}</span><small>${esc(r.species)} · ${esc(r.personality)}</small></button></li>`).join("");
    ul.querySelectorAll("button").forEach(b=>b.onmousedown=e=>{e.preventDefault();pick(items[+b.dataset.i])})};
  inp.addEventListener("input",()=>{const q=inp.value.trim();if(!q){close();return}
    const a=[],b=[];for(const r of DEXMAP.values()){if(r.name.startsWith(q))a.push(r);else if(r.name.includes(q))b.push(r)}
    items=a.concat(b).slice(0,8);on=-1;if(!items.length||(items.length===1&&items[0].name===q&&$("#fSpecies").value)){close();return}
    ul.hidden=false;inp.setAttribute("aria-expanded","true");draw()});
  inp.addEventListener("keydown",e=>{if(ul.hidden)return;
    if(e.key==="ArrowDown"){e.preventDefault();on=Math.min(items.length-1,on+1);draw()}
    else if(e.key==="ArrowUp"){e.preventDefault();on=Math.max(0,on-1);draw()}
    else if(e.key==="Enter"&&on>=0){e.preventDefault();pick(items[on])}
    else if(e.key==="Escape"){e.stopPropagation();close()}});
  const sh=inp.closest(".sheet");if(sh)sh.addEventListener("scroll",()=>{if(!ul.hidden)close()},{passive:true});
  inp.addEventListener("blur",()=>{setTimeout(close,120);const r=DEXMAP.get(inp.value.trim());if(r&&!$("#fSpecies").value)pick(r)});
}

/* ---------- photos ---------- */
function loadImage(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{res(im);setTimeout(()=>URL.revokeObjectURL(u),1000)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("decode"))};im.src=u})}
function drawTo(im,M){const k=Math.min(1,M/Math.max(im.naturalWidth,im.naturalHeight));
  const c=document.createElement("canvas");c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);return c}
async function shrink(im){const c=drawTo(im,1400);return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",.85))}
function smallDataURL(im){for(const [M,q] of [[1000,.75],[800,.7],[640,.65],[480,.6]]){const u=drawTo(im,M).toDataURL("image/jpeg",q);if(u.length<200000)return u}throw new Error("too big")}
async function savePhoto(file){
  const im=await loadImage(file),blob=await shrink(im),id=newId();
  await IDB.put("photos",id,blob);S.photoURLs.set(id,URL.createObjectURL(blob));
  return {id,kind:"local",date:todayStr()};
}
async function dropPhoto(id){try{await IDB.del("photos",id)}catch(e){}const u=S.photoURLs.get(id);if(u)URL.revokeObjectURL(u);S.photoURLs.delete(id)}
async function addPhotos(id,files,msgEl){
  const done=[];let fail=0;
  for(let i=0;i<files.length;i++){
    msgEl.textContent=`사진 올리는 중… ${i+1}/${files.length}`;
    try{done.push(await savePhoto(files[i]))}catch(e){fail++;console.warn("photo",e)}
  }
  if(done.length){const v=S.villagers.find(x=>x.id===id);if(v){try{await putVillager({...v,photos:[...(v.photos||[]),...done]})}catch(e){msgEl.textContent=writeFailed(e);return}}}
  openDetail(id);
  if(fail){const m=$("#dErr");if(m)m.textContent=`사진 ${fail}장을 올리지 못했어요. 사진 파일(JPG, PNG)인지 확인해 주세요.`}
}

function photosHTML(v,W){
  const ps=v.photos||[],canAdd=W&&S.idbOk;
  if(!ps.length&&!canAdd)return S.mode==="local"&&W?`<div class="sec"><h3>사진</h3><div class="hint">이 화면에서는 사진을 올릴 수 없어요. 등록부 링크를 Claude 앱이나 claude.ai에서 열면 사진을 넣을 수 있어요.</div></div>`:"";
  return `<div class="sec"><h3>사진 <span class="hint num">${ps.length?ps.length+"장":""}</span></h3><div class="photos">
  ${ps.map((p,i)=>`<button class="ph" data-ph="${i}" aria-label="사진 ${i+1} 크게 보기">${imgTag(p,'loading="lazy"')}${i===0?`<span class="cov">대표</span>`:""}</button>`).join("")}
  ${canAdd?`<label class="ph-add" id="phDrop">${FINE?"+ 사진 추가<br><small>또는 끌어다 놓기</small>":"+ 사진 추가"}<input type="file" id="phFile" accept="image/*" multiple></label>`:""}</div>
  ${canAdd?`<textarea class="paste" id="phPaste" rows="1" placeholder="${FINE?"복사한 사진을 여기에 붙여넣기 (Ctrl+V)":"복사한 사진은 여기를 길게 눌러 붙여넣기"}" aria-label="사진 붙여넣기"></textarea>`:""}
  ${canAdd?`<div class="hint" id="phMsg">${ps.length?"":"게임 스크린샷을 올려 보세요. 첫 사진이 대표 사진이 돼요."}</div>`:""}</div>`;
}
function openPhoto(v,i,askDel){
  const ps=v.photos||[],p=ps[i];if(!p)return openDetail(v.id);
  sheetState={type:"detail",id:v.id};
  const W=S.canWrite&&S.idbOk;
  showSheet(`<div class="sheet-head"><h2>${esc(v.name)}의 사진 <span class="hint num">${i+1}/${ps.length}</span></h2><button class="x" data-close aria-label="닫기">×</button></div>
  ${imgTag(p,'class="big-photo"')}
  <div class="hint num">${p.date?fmtDate(p.date)+"에 올림":""}</div>
  <div class="err" id="pErr" role="alert"></div>
  <div class="actions">
    <button class="btn ghost" id="pBack">← 기록으로</button>
    ${ps.length>1?`<button class="btn" id="pPrev" ${i===0?"disabled":""}>이전</button><button class="btn" id="pNext" ${i===ps.length-1?"disabled":""}>다음</button>`:""}
    ${W&&i>0&&!askDel?`<button class="btn" id="pCover">대표 사진으로</button>`:""}
    ${W?(askDel?`<span style="align-self:center;font-size:14px">이 사진을 지울까요?</span><button class="btn ghost" id="pNo">그대로 두기</button><button class="btn danger" id="pYes">지우기</button>`:`<button class="btn danger" id="pDel">사진 지우기</button>`):""}
  </div>`);
  const on=(s,f)=>{const el=$(s);if(el)el.onclick=f};
  on("#pBack",()=>openDetail(v.id));
  on("#pPrev",()=>openPhoto(v,i-1));on("#pNext",()=>openPhoto(v,i+1));
  on("#pDel",()=>openPhoto(v,i,true));on("#pNo",()=>openPhoto(v,i));
  on("#pCover",async()=>{const cur=S.villagers.find(x=>x.id===v.id)||v;const a=[...(cur.photos||[])];const [x]=a.splice(i,1);a.unshift(x);
    try{await putVillager({...cur,photos:a});openDetail(v.id)}catch(e){$("#pErr").textContent=writeFailed(e)}});
  on("#pYes",async()=>{const cur=S.villagers.find(x=>x.id===v.id)||v;const a=(cur.photos||[]).filter(x=>x.id!==p.id);
    try{await putVillager({...cur,photos:a});await dropPhoto(p.id);openDetail(v.id)}catch(e){$("#pErr").textContent=writeFailed(e)}});
}

function openDetail(id,sub){
  const v=S.villagers.find(x=>x.id===id);if(!v)return;
  sheetState={type:"detail",id};
  if(sub&&sub.startsWith("photo:"))return openPhoto(v,+sub.split(":")[1],sub.endsWith(":del"));
  const n=stayDays(v),gone=!isNow(v),R=route(v),dx=DEXMAP.get(v.name);
  const entries=[...(v.entries||[])].map((e,i)=>({...e,i})).sort((a,b)=>a.date.localeCompare(b.date));
  const log=[{date:v.moveIn,p:v.inPrec,text:`입주${R?` · ${R}`:""}`,cls:"in"},...entries.map(e=>({...e,cls:""})),...(gone?[{date:v.moveOut,p:v.outPrec,text:`이사${v.leaveReason?` · ${v.leaveReason}`:""}`,cls:"out"}]:[])];
  const W=S.canWrite;
  showSheet(`<div class="sheet-head"><div class="id-top">${avatar(v)}<div><h2>${esc(v.name)}</h2><div class="meta">${[v.species,v.personality,v.birthday?`생일 ${fmtBday(v.birthday)}`:""].filter(Boolean).map(esc).join(" · ")}</div></div></div><button class="x" data-close aria-label="닫기">×</button></div>
  <div class="stay ${gone?"gone":""}"><span class="big num">${gone?stayText(n,approx(v)):(n==null?"기간 모름":n>=1?`${approx(v)?"약 ":""}${n}일째`:stayText(n))}</span><span class="meta">${gone?"함께 산 기간":"우리 섬에서 사는 중"}</span>${v.example?`<span class="chip ex">예시</span>`:""}</div>
  <dl class="dl"><dt>입주</dt><dd class="num">${fmtDate(v.moveIn,v.inPrec)}</dd>
  ${R?`<dt>이사 경로</dt><dd>${routeChip(v)}</dd>`:""}
  ${!gone?`<dt>지박령</dt><dd>${v.forever?`확정이에요. 이사 상담은 무조건 거절!${W?`<button class="quick" id="foreverBtn">취소</button>`:""}`:`아직이에요${W?`<button class="quick" id="foreverBtn">확정하기</button>`:""}`}</dd>`:""}
  <dt>주민 사진</dt><dd class="num">${v.gotPhoto?`받았어요`:`아직 못 받았어요${W?`<button class="quick" id="picBtn">받았어요</button>`:""}`}</dd>
  ${dx&&dx.catch?`<dt>말버릇</dt><dd>“${esc(dx.catch)}”</dd>`:""}
  ${gone?`<dt>이사</dt><dd class="num">${fmtDate(v.moveOut,v.outPrec)}${v.leaveReason?` · ${esc(v.leaveReason)}`:""}</dd>`:""}</dl>
  ${photosHTML(v,W)}
  ${v.note?`<div class="sec"><h3>메모</h3><div class="note">${esc(v.note)}</div></div>`:""}
  ${gone&&v.farewell?`<div class="sec"><h3>마지막 인사</h3><div class="note">${esc(v.farewell)}</div></div>`:""}
  <div class="sec"><h3>함께한 날들</h3><ul class="diary">${log.map(e=>`<li class="${e.cls}"><div class="d num">${fmtDate(e.date,e.p)}${e.i!==undefined&&W?` <button class="rm" data-rm="${e.i}">지우기</button>`:""}</div><div class="t">${esc(e.text)}</div></li>`).join("")}</ul>
  ${W?`<form class="add-diary" id="df"><input type="date" id="dDate" value="${todayStr()}" aria-label="날짜"><input type="text" id="dText" maxlength="300" placeholder="선물 받음, 사진 받음, 말버릇 바뀜…" aria-label="기록 내용"><button class="btn" type="submit">기록 추가</button></form>`:""}</div>
  ${W&&!gone&&sub!=="leave"?`<button class="btn warm" id="leaveBtn">이사 갔어요</button>`:""}
  ${W&&sub==="leave"?`<form class="panel warm" id="lf"><h3 class="disp" style="font-size:18px">${esc(v.name)}의 이사 기록</h3>
    <div class="fields">${datePick("lD","이사 간 날",todayStr(),"day")}
    <div class="f"><label for="lWhy">이사 이유</label><select id="lWhy">${opts(LEAVE,"","선택 안 함")}</select></div>
    <div class="f wide"><label for="lBye">마지막 인사</label><textarea id="lBye" maxlength="500" placeholder="떠나기 전에 남긴 말, 받은 사진…"></textarea></div></div>
    <div class="err" id="lErr" role="alert"></div>
    <div class="actions"><button type="button" class="btn ghost" id="lCancel">취소</button><button class="btn warm" type="submit">이사 기록 저장</button></div></form>`:""}
  <div class="err" id="dErr" role="alert"></div>
  ${W?`<div class="actions">${sub==="del"?`<span style="align-self:center;font-size:14px">${esc(v.name)}의 기록을 모두 지울까요?</span><button class="btn ghost" id="delNo">그대로 두기</button><button class="btn danger" id="delYes">지우기</button>`:`<button class="btn danger" id="delAsk">기록 지우기</button><button class="btn" id="editBtn">고치기</button>`}</div>`:""}`);
  const on=(s,f)=>{const el=$(s);if(el)el.onclick=f};
  on("#leaveBtn",()=>openDetail(id,"leave"));
  on("#foreverBtn",async()=>{try{await putVillager({...v,forever:!v.forever});openDetail(id)}catch(e){$("#dErr").textContent=writeFailed(e)}});
  on("#picBtn",async()=>{try{await putVillager({...v,gotPhoto:true});openDetail(id)}catch(e){$("#dErr").textContent=writeFailed(e)}});
  document.querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>openDetail(id,"photo:"+b.dataset.ph));
  const pf=$("#phFile");if(pf){pf.onchange=()=>{const fs=[...pf.files].slice(0,12);if(fs.length)addPhotos(id,fs,$("#phMsg"))};}
  const dz=$("#phDrop");if(dz){dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("over")});dz.addEventListener("dragleave",()=>dz.classList.remove("over"));
    dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("over");const fs=[...(e.dataTransfer?.files||[])].filter(f=>f.type.startsWith("image/"));if(fs.length)addPhotos(id,fs.slice(0,12),$("#phMsg"))})}
  const pp=$("#phPaste");if(pp)pp.addEventListener("paste",e=>{const fs=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith("image/"));e.preventDefault();pp.value="";
    if(fs.length)addPhotos(id,fs.slice(0,12),$("#phMsg"));else $("#phMsg").textContent="붙여 넣은 내용에 사진이 없어요. 사진을 복사한 뒤 다시 붙여 넣어 주세요."});
  on("#lCancel",()=>openDetail(id));
  on("#editBtn",()=>openForm(id));
  on("#delAsk",()=>openDetail(id,"del"));
  on("#delNo",()=>openDetail(id));
  on("#delYes",async()=>{try{await delVillager(id);closeSheet()}catch(e){$("#dErr").textContent=writeFailed(e)}});
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{const es=[...(v.entries||[])];es.splice(Number(b.dataset.rm),1);try{await putVillager({...v,entries:es});openDetail(id)}catch(e){$("#dErr").textContent=writeFailed(e)}});
  const df=$("#df");if(df)df.onsubmit=async e=>{e.preventDefault();const t=$("#dText").value.trim(),d=$("#dDate").value||todayStr();if(!t){$("#dText").focus();return}
    try{await putVillager({...v,entries:[...(v.entries||[]),{date:d,text:t}]});openDetail(id)}catch(err){$("#dErr").textContent=writeFailed(err)}};
  const lf=$("#lf");if(lf){wireDate("lD");$("#lDP").focus();lf.onsubmit=async e=>{e.preventDefault();const r=readDate("lD");if(r.err){$("#lErr").textContent="이사 간 날을 고르거나 ‘기억 안 나요’를 선택해 주세요.";return}
    const k=r.prec==="month"?7:10;if(r.date&&v.moveIn&&r.date.slice(0,k)<v.moveIn.slice(0,k)){$("#lErr").textContent="이사 간 날이 입주일보다 빨라요.";return}
    try{await putVillager({...v,moveOut:r.date,outPrec:r.prec,left:true,leaveReason:$("#lWhy").value,farewell:$("#lBye").value.trim()});openDetail(id)}catch(err){$("#lErr").textContent=writeFailed(err)}}}
}

/* ---------- wiring ---------- */
$("#tabs").addEventListener("click",e=>{const t=e.target.closest(".tab");if(!t)return;S.tab=t.dataset.tab;try{localStorage.setItem("acnh-tab",S.tab)}catch(err){}render();window.scrollTo(0,0)});
$("#fab").onclick=()=>openForm();
document.addEventListener("keydown",e=>{if(sheetState||e.ctrlKey||e.metaKey||e.altKey)return;const t=e.target;if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)))return;
  if((e.key==="n"||e.key==="N"||e.key==="ㅜ")&&S.canWrite){e.preventDefault();openForm()}
  else if(["1","2","3","4","5"].includes(e.key)){S.tab=["now","gone","timeline","dex","guide"][+e.key-1];try{localStorage.setItem("acnh-tab",S.tab)}catch(err){}render();window.scrollTo(0,0)}});
let rt;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if(S.tab==="timeline"&&S.mode)render()},200)});
boot();
</script>

</body>
</html>
